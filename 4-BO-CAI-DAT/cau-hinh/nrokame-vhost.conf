# ==========================================================================
#  NGOC RONG KAME - CAU HINH TEN MIEN CHO APACHE (XAMPP)
#
#  Muc dich: cho nrokame.com va www.nrokame.com deu mo ra trang web trong
#            C:\xampp\htdocs
#
#  ---------------------------------------------------------------------
#  CHEP DOAN NAY VAO DAU?
#  ---------------------------------------------------------------------
#  File:  C:\xampp\apache\conf\extra\httpd-vhosts.conf
#  Cach:  mo file do bang Notepad, keo xuong CUOI FILE, chep toan bo phan
#         nam giua hai dong "=== BAT DAU CHEP ===" va "=== HET CHEP ===" ben duoi,
#         dan vao, luu lai.
#
#  KHONG can sua httpd.conf de nap file nay: httpd.conf dong 521 da co san
#  dong "Include conf/extra/httpd-vhosts.conf" (toi da kiem tra tren may ban).
#
#  ---------------------------------------------------------------------
#  CON MOT CHO NUA PHAI SUA (file khac)
#  ---------------------------------------------------------------------
#  File:  C:\xampp\apache\conf\httpd.conf   -   dong 228
#     Hien tai :  ServerName localhost:80
#     Doi thanh:  ServerName nrokame.com:80
#  Khong doi thi Apache van chay, nhung moi lan khoi dong se canh bao trong log,
#  va vai duong dan Apache tu sinh ra se tro ve "localhost" - nguoi choi bam vao
#  la lac sang may cua chinh ho.
#
#  ---------------------------------------------------------------------
#  SAU KHI SUA XONG
#  ---------------------------------------------------------------------
#  1) Mo XAMPP Control Panel -> nut Stop o dong Apache -> doi 3 giay -> Start.
#  2) Neu Apache KHONG chiu bat len, thuong la go sai dau ngoac kep hoac
#     thieu dong </VirtualHost>. Kiem tra bang lenh nay (chay trong PowerShell):
#         C:\xampp\apache\bin\httpd.exe -t
#     Ket qua "Syntax OK" la dat.
#     Xem danh sach ten mien Apache da nhan:
#         C:\xampp\apache\bin\httpd.exe -S
#  3) Kiem tra that: lay dien thoai, TAT WIFI (dung 4G), vao http://nrokame.com
#     Ra trang web tuc la ca DNS lan cong 80 da thong.
#
#  ---------------------------------------------------------------------
#  BA DIEU DE HIEU NHAM - DOC KY
#  ---------------------------------------------------------------------
#  (1) DAY LA VHOST DUY NHAT, nen no cung la vhost MAC DINH. Nghia la nguoi ta
#      go thang http://103.116.38.60 cung ra dung trang web nay. Do la binh thuong.
#
#  (2) KHONG viet them khoi <Directory> o day. httpd.conf dong 253-273 da co san
#      khoi <Directory "C:/xampp/htdocs"> voi "AllowOverride All" - vhost nay dung
#      chung DocumentRoot nen tu duoc huong. Neu ban tu them mot khoi <Directory>
#      khac ma quen "AllowOverride All" thi file .htaccess bi Apache BO QUA HOAN TOAN:
#      duong dan sach (/sv1/trangchu) hong het VA lop chan spam ddos_guard.php
#      im lang khong chay. Ca hai deu khong bao loi gi - rat kho doan ra.
#
#  (3) BUOC NAY CHUA CO HTTPS (khoa xanh). Xem phan ghi chu o cuoi file.
# ==========================================================================


# =========================== BAT DAU CHEP ===========================

# --- Ngoc Rong Kame - trang web chinh ---
<VirtualHost *:80>
    ServerName nrokame.com
    ServerAlias www.nrokame.com

    DocumentRoot "C:/xampp/htdocs"

    # Ghi nhat ky rieng cho ten mien nay, de tach khoi log chung cua XAMPP.
    # Duong dan tinh tu C:\xampp\apache\ nen file that se nam o
    # C:\xampp\apache\logs\nrokame-error.log
    ErrorLog  "logs/nrokame-error.log"
    CustomLog "logs/nrokame-access.log" combined
</VirtualHost>

# ============================ HET CHEP ==============================


# ==========================================================================
#  GHI CHU VE HTTPS (khoa xanh) - CHUA LAM O BUOC NAY, CO CHU Y
# ==========================================================================
#  Apache cua ban DA duoc cau hinh nghe cong 443 san roi
#  (httpd.conf dong 545 nap file conf\extra\httpd-ssl.conf, file do dong 36 co "Listen 443").
#
#  NHUNG chung chi dang dung la chung chi mac dinh cua XAMPP - loai "tu ky".
#  Trinh duyet cua nguoi choi se hien mot trang canh bao do to dung "Ket noi cua ban
#  khong rieng tu", va phan lon nguoi choi se quay di ngay.
#
#  Vi vay: giai doan dau CHI MO CONG 80. Dung mo cong 443 voi chung chi tu ky -
#  chi tao them mot cua cho nguoi ta go vao ma khong duoc loi ich gi.
#
#  KHI NAO MUON CO KHOA XANH, chon 1 trong 2 duong:
#
#    Cach A (de nhat, khuyen dung): dua nrokame.com qua Cloudflare va bat che do
#    proxy (dam may mau cam). Cloudflare cap chung chi mien phi va tu lo phan ma hoa.
#    Ban KHONG phai dung gi den Apache. Luu y: sau khi qua Cloudflare thi moi dia chi
#    IP nguoi truy cap deu thanh IP cua Cloudflare - luc do moi tinh den chuyen bat
#    DDOS_GUARD_ENFORCE_CLOUDFLARE = true trong ddos_guard.php dong 14.
#    Bat som qua la tu khoa chinh minh ra khoi web (loi 403).
#
#    Cach B: xin chung chi Let's Encrypt mien phi, roi thay dung 2 dong trong
#    C:\xampp\apache\conf\extra\httpd-ssl.conf:
#         dong 144  SSLCertificateFile     -> tro toi file .crt moi
#         dong 154  SSLCertificateKeyFile  -> tro toi file .key moi
#    Khoi dong lai Apache, roi moi mo cong 443 o tuong lua:
#         netsh advfirewall firewall add rule name="Kame - Web HTTPS 443" dir=in action=allow protocol=TCP localport=443
#
#  Neu sau nay CO bat HTTPS, hay them mot vhost thu hai cho cong 443 voi
#  ServerName/ServerAlias giong het o tren, dung quen ServerAlias www.
# ==========================================================================
