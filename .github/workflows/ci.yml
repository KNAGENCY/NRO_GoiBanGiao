# CI cho du an NRO. NAM IM cho toi khi repo co remote GitHub — luc do tu chay
# moi push/PR. Chay tay moi thu bang: powershell -File kiem-tra-tat-ca.ps1
name: CI

on: [push, pull_request]

jobs:
  go:
    name: Go (build + vet + test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: nrodev123
          POSTGRES_DB: nro_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - name: gofmt (dinh dang phai sach)
        working-directory: server
        # Sau khi chuan hoa LF (.gitattributes eol=lf), gofmt phai khong in gi.
        # `gofmt -l` liet ke file sai dinh dang; co file nao -> fail build.
        run: |
          xau=$(gofmt -l internal cmd)
          if [ -n "$xau" ]; then
            echo "gofmt bao file sai dinh dang:"; echo "$xau"; exit 1
          fi
      - name: build + vet + test
        working-directory: server
        env:
          NRO_TEST_DSN: postgres://postgres:nrodev123@127.0.0.1:5432/nro_test
        run: |
          go build ./...
          go vet ./...
          go test ./...

  python:
    name: Python (pytest assetpack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: cai deps
        run: |
          python -m pip install --upgrade pip
          pip install -r assetpack/requirements.txt pytest
      - name: pytest assetpack
        env:
          PYTHONUTF8: '1'
        # Bo test_task6b_canonical_preflight.py: gia dinh layout git-worktree (bug path co san).
        run: python -m pytest assetpack -q --ignore=assetpack/tests/test_task6b_canonical_preflight.py
