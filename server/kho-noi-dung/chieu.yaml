# chieu.yaml — CHIÊU THỨC: 5 làng × 4 chiêu × 3 cấp = 20 chiêu, 60 cấp.
#
# ============================================================================
# ⚠️ THỨ TỰ TRONG FILE NÀY LÀ DỮ LIỆU, KHÔNG PHẢI CÁCH TRÌNH BÀY.
#
#   - Khối `lang:` phải theo đúng thứ tự id 0,1,2,3,4. Đảo hai khối = đổi chiêu
#     của cả hai làng.
#   - `diem:` của mỗi cấp phải bằng vị trí của nó trong `cac_cap` (1,2,3).
#   - `template_id` KHÔNG BAO GIỜ được là 0: client có một nhánh nhồi hai cấp
#     giả (105/106) khi templateId == 0. Bộ kiểm chặn.
#   - `loai` chỉ được là 1 (đánh) / 2 (buff hồi máu) / 3 (tự thân) — ba kiểu máy
#     chủ ĐÃ CÀI ĐẶT. Thêm một kiểu mới (choáng, đẩy lùi, độc, khiên, hút máu)
#     là VIẾT CODE MÁY CHỦ MỚI, không phải thêm một dòng ở đây.
# ============================================================================
#
# CON SỐ Ở ĐÂU RA: đây là bản chuyển NGUYÊN VĂN dữ liệu Go hôm nay
# (game/chieuthuc.go, hàm xayDungChieuTheoLang + taoCapChieu) sang YAML, KHÔNG
# đổi một số nào. Bên Go sinh chúng bằng công thức theo vị trí:
#
#     template_id  = slot + 1                (1..4)
#     skill_id gốc = 1 + (lang*4 + slot)*3   (mỗi chiêu chiếm 3 số liên tiếp)
#     icon_id      = 1 + lang*4 + slot
#     chakra_dung     = (10 + slot*5)  + (cấp-1)*10
#     he_so_phan_tram = (20 + slot*10) + (cấp-1)*20
#     gia             = (50 + slot*20) + (cấp-1)*50
#     nhan_luc_can = cấp * 1000
#     hoi_chieu_ms = 1000 + (cấp-1)*300
#
# ĐƠN VỊ `he_so_phan_tram` — CHỐT ở đặc tả KH8 §5.1
# (docs/superpowers/specs/2026-09-03-kh8-kho-noi-dung-design.md):
#
#   100 = bằng đúng sát thương gốc của nhân vật ra đòn; 20 = 20% sát thương
#   gốc. KHÔNG PHẢI số cộng dồn tuyệt đối. Kết quả phép nhân luôn LÀM TRÒN
#   XUỐNG số nguyên (công thức đầy đủ ở game/satthuong.go, hàm TinhSatThuong).
#   Đổi tên trường từ `sat_thuong` cũ sang tên này chính là để không ai đọc
#   nhầm thành số tuyệt đối nữa — bộ nạp (KnownFields(true)) từ chối thẳng nếu
#   ai đó lỡ gõ lại tên cũ.
#
# VÌ SAO GIỜ VIẾT TƯỜNG MINH TỪNG SỐ thay vì giữ công thức: chính chú thích
# trong code đã nói "Gia tri chi la KHOI DAU can chinh o KH8". Với công thức,
# muốn chỉnh sát thương của MỘT chiêu là phải sửa hàm sinh — tức sửa TẤT CẢ
# chiêu. Viết tường minh là để chỉnh được từng chiêu một.
#
# VÌ SAO các con số hiện tại là như vậy (chú thích chuyển từ chieuthuc.go):
#   - slot 0 cận chiến tầm 100 · slot 1 tầm xa 300 · slot 2 hồi máu tầm 300
#     (BẮT BUỘC có: gói -60 báo hồi máu chỉ sinh ra từ chiêu loai=2) ·
#     slot 3 tự thân, tầm 0 (không phát gói chiến đấu).
#   - `dx` và `dy` cố tình bằng nhau: client đọc cả hai nhưng dùng chung một
#     giá trị tầm.
#   - `he_so_phan_tram` với chiêu loai=2 KHÔNG phải sát thương mà là LƯỢNG HỒI
#     MÁU — bản Java tái sử dụng cùng ô. Đừng đọc nhầm.
#   - `icon_id` hiện sinh THEO VỊ TRÍ, chưa phải id icon thật của bộ mỹ thuật.
#     Khi có bộ icon thật, THÊM Ở CUỐI bảng tra, tuyệt đối không chèn giữa.
#   - `them_thong_tin` để rỗng: bản Java ghi tên thương hiệu cũ vào đây.
#
# KH8 task 6: đã bỏ `ten_lang` (bản sao thứ hai của tên làng, chỉ để định
# hướng, bộ nạp không dùng) — tên làng gửi xuống client giờ đọc TỪ MỘT NGUỒN
# DUY NHẤT: kho-noi-dung/lang.yaml (qua game/lang.go), tra theo id_lang.

