# lang.yaml — 5 LANG NARUTO (thay cho "chung toc" cua ban Dragon Ball cu).
#
# ============================================================================
# ⚠️ THU TU TRONG FILE NAY LA DU LIEU, KHONG PHAI CACH TRINH BAY.
#
#   - `id:` PHAI khai tuong minh va bang dung VI TRI trong danh sach `lang:`
#     (giong mau_vat_pham/mau_option) — id nay dang nam TRONG CSDL nguoi choi
#     (cot nhan_vat.lang), hoan vi hai khoi la doi lang cua MOI nguoi choi da
#     tao nhan vat.
#   - Client cu CHI GUI DUOC id lang 0/1/2 (con dung mang toc 3x3) — KHONG
#     duoc them lang thu 6 (thiet ke §2.2, bang "Lang").
#   - Chi so KHOI DAU la GIA TRI DAU, se can bang lai o Ke hoach 13 (vong can
#     bang that, sau khi Bo do can bang Ke hoach 11/12 xong) — dung sua tuy
#     tien o day truoc do.
# ============================================================================
#
# CON SO O DAU RA: chuyen NGUYEN VAN tu game/lang.go (bien danhSachLang, KH8
# task 6) sang day, KHONG doi mot so nao. Chu thich "vi sao" ben duoi cung
# chep nguyen tu do (thiet ke §7.2 — chi so phan anh tinh cach tung lang: Cat
# chakra cao danh xa, Suong Mu can chien sat thuong, Da mau trau phong thu, May
# toc do chi mang, La can bang).
#
# map_khoi_dau/vi_tri_x_khoi_dau/vi_tri_y_khoi_dau la CHO DAT TRUOC (nhu chu
# thich goc da ghi): ban do that dung o Ke hoach 3/6 cua lo trinh game; o day
# chi can mot toa do hop le de nhan vat ton tai luc tao moi.

lang:
  - id: 0
    ten: "Làng Lá"
    hp_khoi_dau: 200
    chakra_khoi_dau: 150
    # 55 -> mot don can chien cap 1 (20%) = 11 mau. Vong can bang KH8 task 13:
    # goc cu 12 x 20% lam tron xuong con 2 mau, phep lam tron nuot sach chenh
    # lech giua cac lang; nang goc len tam 50-60 de 10% chenh lech con thay duoc.
    sat_thuong_khoi_dau: 55
    map_khoi_dau: 1
    vi_tri_x_khoi_dau: 100
    # 432 = mặt cỏ hàng 18 của map 1 (map-1-collision.bin). Trước 05/09/2026 để 384 (hàng 16,
    # giữa trời): vào game rơi 2 ô. Làng 2–5 chưa có map riêng nên vẫn 384 tạm.
    vi_tri_y_khoi_dau: 432
    vang_khoi_dau: 1000

  - id: 1
    ten: "Làng Cát"
    hp_khoi_dau: 190
    chakra_khoi_dau: 250
    # 50 -> don can chien cap 1 = 10 mau (thap nhat cung Lang Da): Cat manh o
    # chakra/danh xa, khong phai o sat thuong.
    sat_thuong_khoi_dau: 50
    map_khoi_dau: 2
    vi_tri_x_khoi_dau: 100
    vi_tri_y_khoi_dau: 384
    vang_khoi_dau: 1000

  - id: 2
    ten: "Làng Sương Mù"
    # Gion nhat (160) nhung danh dau nhat (60 -> 12 mau moi don): dung tinh cach
    # "can chien sat thuong" cua Suong Mu.
    hp_khoi_dau: 160
    chakra_khoi_dau: 100
    sat_thuong_khoi_dau: 60
    map_khoi_dau: 3
    vi_tri_x_khoi_dau: 100
    vi_tri_y_khoi_dau: 384
    vang_khoi_dau: 1000

  - id: 3
    ten: "Làng Đá"
    # Trau nhat (220) nhung don nhe (50 -> 10 mau): lang phong thu.
    # 250 cu lam Lang Da THANG CA 4 doi thu o D3 - 220 dua no ve 2 thang/1 thua.
    hp_khoi_dau: 220
    chakra_khoi_dau: 100
    sat_thuong_khoi_dau: 50
    map_khoi_dau: 4
    vi_tri_x_khoi_dau: 100
    vi_tri_y_khoi_dau: 384
    vang_khoi_dau: 1000

  - id: 4
    ten: "Làng Mây"
    # 180/55: nhanh nhen, mau vua, don 11 mau - cu 120 mau lam May THUA CA 4.
    hp_khoi_dau: 180
    chakra_khoi_dau: 130
    sat_thuong_khoi_dau: 55
    map_khoi_dau: 5
    vi_tri_x_khoi_dau: 100
    vi_tri_y_khoi_dau: 384
    vang_khoi_dau: 1000
