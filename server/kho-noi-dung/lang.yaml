# lang.yaml — 5 LANG NARUTO (thay cho "chung toc" cua ban Dragon Ball cu).
#
# ============================================================================
# ⚠️ THU TU TRONG FILE NAY LA DU LIEU, KHONG PHAI CACH TRINH BAY.
#
#   - `id:` PHAI khai tuong minh va bang dung VI TRI trong danh sach `lang:`
#     (giong mau_vat_pham/mau_option) — id nay dang nam TRONG CSDL nguoi choi
#     (cot nhan_vat.lang), hoan vi hai khoi la doi lang cua MOI nguoi choi da
#     tao nhan vat.
#   - Client cu CHI GUI DUOC id lang 0/1/2 (con dung mang toc 3x3) — KHONG
#     duoc them lang thu 6 (thiet ke §2.2, bang "Lang").
#   - Chi so KHOI DAU la GIA TRI DAU, se can bang lai o Ke hoach 13 (vong can
#     bang that, sau khi Bo do can bang Ke hoach 11/12 xong) — dung sua tuy
#     tien o day truoc do.
# ============================================================================
#
# CON SO O DAU RA: chuyen NGUYEN VAN tu game/lang.go (bien danhSachLang, KH8
# task 6) sang day, KHONG doi mot so nao. Chu thich "vi sao" ben duoi cung
# chep nguyen tu do (thiet ke §7.2 — chi so phan anh tinh cach tung lang: Cat
# chakra cao danh xa, Suong Mu can chien sat thuong, Da mau trau phong thu, May
# toc do chi mang, La can bang).
#
# map_khoi_dau/vi_tri_x_khoi_dau/vi_tri_y_khoi_dau la CHO DAT TRUOC (nhu chu
# thich goc da ghi): ban do that dung o Ke hoach 3/6 cua lo trinh game; o day
# chi can mot toa do hop le de nhan vat ton tai luc tao moi.

